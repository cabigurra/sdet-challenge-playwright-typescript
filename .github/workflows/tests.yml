name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e:
    name: e2e (${{ matrix.env }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t sdet-challenge-api docker/node

      - name: Start the API
        run: |
          docker run -d --name sdet-challenge -p 3000:3000 sdet-challenge-api
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/dev/users >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::API did not become ready in 60s"
          docker logs sdet-challenge
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.env }} E2E suite
        env:
          BASE_URL: http://localhost:3000
          ENV: ${{ matrix.env }}
        run: npx playwright test

      - name: Upload ${{ matrix.env }} test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.env }}
          path: reports/

      - name: Stop the API
        if: always()
        run: docker rm -f sdet-challenge
